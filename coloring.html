<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boo-Boo Rex Coloring Book Reader</title><style>
*{box-sizing:border-box}body{margin:0;background:#102e27;color:#fff8d8;font-family:system-ui,sans-serif;text-align:center}header{padding:16px;background:#0c3027}header a{color:#ffe36a;font-weight:800;text-decoration:none}h1{color:#ffe36a;font-size:clamp(1.5rem,4vw,2.7rem)}.purchase-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:1100px;margin:12px auto;padding:0 10px}.purchase-strip a{display:flex;justify-content:center;align-items:center;border-radius:12px;padding:10px 5px;min-height:55px;text-decoration:none;font-weight:900;color:#173526;font-size:clamp(.65rem,2vw,1rem)}.purchase-strip a:nth-child(1){background:#ffcb4c}.purchase-strip a:nth-child(2){background:#baf3d0}.purchase-strip a:nth-child(3){background:#ff9fbd}.reader{max-width:850px;margin:auto;padding:10px}#page{display:block;max-width:100%;max-height:65dvh;width:auto;margin:10px auto;border:4px solid #fff3c9;border-radius:9px}.controls{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0 25px}button{border:0;border-radius:25px;background:#f7c443;color:#173526;padding:12px 18px;font-weight:900;cursor:pointer}button:disabled{opacity:.4}#full{background:#d7f4a2}.fullscreen{position:fixed;inset:0;z-index:20;background:#102e27;overflow:auto;display:flex;flex-direction:column;justify-content:flex-start}.fullscreen header,.fullscreen h1,.fullscreen .intro{display:none}.fullscreen .purchase-strip{width:100%;margin:50px auto 5px}.fullscreen #page{max-height:calc(100dvh - 210px);max-width:100%;object-fit:contain;margin:auto}.fullscreen .reader{flex:1;min-height:0;display:flex;flex-direction:column;width:100%}.fullscreen .controls{margin:8px auto}.fullscreen #full{position:fixed;top:6px;right:6px;z-index:30}@media(max-width:600px){.controls{gap:6px}button{padding:10px 8px;font-size:.8rem}.fullscreen #page{max-height:calc(100dvh - 185px)}}
</style></head><body><header><a href="/">🦖 Back to Boo-Boo Rex</a></header><h1>🎨 Boo-Boo Rex Coloring Book</h1><p class="intro">Flip through all 24 illustrated coloring pages!</p><div class="purchase-strip"><a href="https://www.amazon.com/dp/B0HPGQ81HV" target="_blank">📖 Buy the Storybook</a><a href="/books.html">📚 More Books by Glenn Conley</a><a href="https://www.amazon.com/dp/B0HKDCQMCS" target="_blank">🎨 Buy the Coloring Book</a></div><div class="reader"><button id="full">⛶ Fullscreen</button><img id="page" src="coloring-pages/01.webp" alt="Coloring book page 1"><div class="controls"><button id="prev">← Previous</button><strong id="count">Page 1 of 24</strong><button id="next">Next →</button></div></div><script>
let n=1;const total=24;const img=document.getElementById('page'),count=document.getElementById('count');function show(v){n=Math.max(1,Math.min(total,v));img.src='coloring-pages/'+String(n).padStart(2,'0')+'.webp';img.alt='Coloring book page '+n;count.textContent='Page '+n+' of '+total;document.getElementById('prev').disabled=n===1;document.getElementById('next').disabled=n===total}document.getElementById('prev').onclick=()=>show(n-1);document.getElementById('next').onclick=()=>show(n+1);document.getElementById('full').onclick=()=>{let on=document.body.classList.toggle('fullscreen');document.getElementById('full').textContent=on?'✕ Exit Fullscreen':'⛶ Fullscreen'};document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.body.classList.remove('fullscreen');document.getElementById('full').textContent='⛶ Fullscreen'}else if(e.key==='ArrowLeft')show(n-1);else if(e.key==='ArrowRight')show(n+1)});show(1);
</script></body></html>
